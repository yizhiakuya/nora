name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nora-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nora-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nora-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deadcode
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: nora-api
      - name: Real HTTP acceptance
        env:
          DB_PASSWORD: nora-ci-disposable-password
          NORA_DB_PASSWORD: nora-ci-disposable-password
          NORA_AUTH_TOKEN: nora-ci-disposable-token
          NORA_RELAY_BASE: ""
        run: |
          pids=()
          trap 'docker rm -f nora-e2e-redis >/dev/null 2>&1 || true; kill "${pids[@]}" 2>/dev/null || true; docker compose -f nora-api/docker-compose.prod.yml down -v' EXIT
          docker compose -f nora-api/docker-compose.prod.yml up -d --wait --wait-timeout 180 postgres
          docker run -d --name nora-e2e-redis -p 127.0.0.1:16379:6379 redis:7-alpine
          java -jar nora-api/target/nora-api-0.1.0-SNAPSHOT.jar > "${RUNNER_TEMP}/nora-api.log" 2>&1 &
          pids+=("$!")
          python scripts/acceptance.py standards
      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-acceptance-logs
          path: ${{ runner.temp }}/nora-api.log
