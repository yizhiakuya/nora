# Existing volume and project names are preserved for upgrades.
name: nora
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nora
      POSTGRES_USER: ${DB_USER:-nora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-nora-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nora} -d nora"]
      interval: 5s
      timeout: 3s
      retries: 20
  nora-api:
    image: ghcr.io/yizhiakuya/nora/nora-api:${NORA_TAG:-latest}
    container_name: nora-api
    restart: unless-stopped
    init: true
    mem_limit: 2g
    dns: [223.5.5.5, 8.8.8.8]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "${API_PORT:-18080}:18080"
    environment:
      NORA_PORT: "18080"
      NORA_DB_URL: jdbc:postgresql://postgres:5432/nora
      NORA_DB_USERNAME: ${DB_USER:-nora}
      NORA_DB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      NORA_AUTH_TOKEN: ${NORA_AUTH_TOKEN:-}
      NORA_FILE_STORAGE_DIR: /app/data/files
      NORA_AGENT_WORKSPACE: /app/agent-workspace
      NORA_MEDIA_CACHE_DIR: /app/data/media-cache
      LOG_PATH: /app/logs
      NORA_PWSH_BUNDLE: ""
      NORA_EMBEDDING_API_KEY: ${NORA_EMBEDDING_API_KEY:-}
      NORA_EMBEDDING_BASE_URL: ${NORA_EMBEDDING_BASE_URL:-https://api.jina.ai/v1}
      NORA_PROXY_ENABLED: ${NORA_PROXY_ENABLED:-false}
      NORA_PROXY_HOST: ${NORA_PROXY_HOST:-127.0.0.1}
      NORA_PROXY_PORT: ${NORA_PROXY_PORT:-7897}
      JAVA_OPTS: "-XX:MaxRAMPercentage=50 -XX:+UseG1GC -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true"
      TZ: Asia/Shanghai
    volumes:
      - nora-data:/app/data
      - nora-workspace:/app/agent-workspace
      - nora-logs:/app/logs
      # Single-user system agent: Docker access is part of its host capabilities.
      - /var/run/docker.sock:/var/run/docker.sock
  nora-web:
    image: ghcr.io/yizhiakuya/nora/nora-web:${NORA_TAG:-latest}
    container_name: nora-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-13001}:80"
    depends_on:
      nora-api: { condition: service_healthy }
networks:
  default:
    name: nora_default
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
volumes:
  pgdata:
  nora-data:
  nora-workspace:
  nora-logs:
