services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres
    environment:
      POSTGRES_DB: nora
      POSTGRES_USER: nora
      POSTGRES_PASSWORD: nora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["dev-basic", "dev-all"]

  redis:
    image: redis:7-alpine
    container_name: nora-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["dev-basic", "dev-all"]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nora-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["dev-basic", "dev-all"]

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: nora-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    profiles: ["dev-all"]

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: nora-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
    profiles: ["dev-all"]

  # 服务镜像在 Phase 1+ 逐个加入（services/<name>/Dockerfile 就绪后取消注释）
  # gateway-service:
  #   build: services/gateway-service
  #   ports: ["8080:8080"]
  #   depends_on: [nacos, postgres, redis]
  #   profiles: ["dev-all"]

volumes:
  pgdata:
