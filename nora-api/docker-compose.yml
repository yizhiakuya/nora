# Local development needs only PostgreSQL; applications run on the host.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nora
      POSTGRES_USER: nora
      POSTGRES_PASSWORD: nora
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-nora-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
