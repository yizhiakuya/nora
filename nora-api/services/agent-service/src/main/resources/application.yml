server:
  port: 8083

spring:
  application:
    name: agent-service
  jackson:
    # 全局统一时区:Date/Instant 序列化偏移(JVM 默认时区由 nora-common TimeZoneConfig 设置)
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:postgresql://localhost:5432/nora?currentSchema=schema_agent
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_agent
    default-schema: schema_agent
    create-schemas: true
  cloud:
    nacos:
      discovery:
        enabled: true

nora:
  # 全局统一时区(nora-common TimeZoneConfig 消费;JVM 默认时区)
  timezone: Asia/Shanghai
  # Redis(平台组件):审批票据跨实例/重启可见 + 跨实例 resolve 广播。
  # 禁用或不可达时服务自动降级为纯内存行为,不影响启动与请求。
  redis:
    enabled: ${NORA_REDIS_ENABLED:true}
    host: ${NORA_REDIS_HOST:localhost}
    port: ${NORA_REDIS_PORT:6379}
    password: ${NORA_REDIS_PASSWORD:}
    database: ${NORA_REDIS_DATABASE:0}
    timeout-ms: ${NORA_REDIS_TIMEOUT_MS:2000}
  agent:
    # 工具轮数保险丝(不是任务预算):循环跑到模型自己不再调工具为止(对齐 Codex/Claude Code),
    # 上下文增长由轮内压缩 + 旧图回收控制、用户随时可停;此值只兜病态死循环,
    # 故给远超正常任务需要的大值(实测"扫相册找猫"50 张照片自然跑 17 轮)。
    max-tool-rounds: 100
    # 本机终端(run_command)的 PowerShell:
    #   默认优先用随仓库分发的内置 pwsh 7(tools/pwsh,首次使用解压到同目录 pwsh-<ver>),
    #   保证版本确定、不依赖宿主机;解压失败/归档缺失时回退 PATH 上的 pwsh,再兜底系统 powershell.exe(5.1)。
    # powershell: 显式指定 pwsh 可执行文件(绝对路径或命令名);空=自动(内置→PATH)
    powershell: ${NORA_POWERSHELL:}
    # pwsh-bundle: 内置 pwsh 归档(zip)路径;空=禁用内置(直接用 PATH)
    pwsh-bundle: ${NORA_PWSH_BUNDLE:D:/claude/Nora/tools/pwsh/PowerShell-7.6.6-win-x64.zip}
  proxy:
    # 出站代理:外网目标(LLM 上游/Jina embedding)经此转发,内网服务互调始终直连。
    # 环境变量覆盖:NORA_PROXY_ENABLED / NORA_PROXY_HOST / NORA_PROXY_PORT
    enabled: ${NORA_PROXY_ENABLED:false}
    host: ${NORA_PROXY_HOST:127.0.0.1}
    port: ${NORA_PROXY_PORT:7897}
    # 直连名单(不走代理):这些「公网域名」实际指向自家宽带/内网,
    # 经代理远程节点绕行反而慢(实测 +2.3s)。媒体中继 home.rainaki.top 即此类。
    bypass-hosts: ${NORA_PROXY_BYPASS_HOSTS:home.rainaki.top}
  # 媒体磁盘缓存(相册等远程媒体):一次拉取跨会话复用,手机离线也能看
  media-cache:
    dir: ${NORA_MEDIA_CACHE_DIR:./data/media-cache}
    max-bytes: ${NORA_MEDIA_CACHE_MAX_BYTES:2147483648}
    # 中继公网基址:用于后台探测其局域网端点(链路自动选择)+ 手机网络状态。
    # 空 = 关闭该功能(媒体拉取仍可走公网直连)。
    relay-base: ${NORA_RELAY_BASE:https://home.rainaki.top:8900}
    # 局域网端点探测周期(秒);探测只打中继 /health,开销可忽略
    lan-probe-seconds: ${NORA_RELAY_LAN_PROBE_SECONDS:120}
  llm:
    api-key: ${NORA_LLM_API_KEY:}
    base-url: ${NORA_LLM_BASE_URL:http://192.168.0.109:28765/v1}
    model: ${NORA_LLM_MODEL:gpt-5.4-mini}
  rag:
    base-url: http://localhost:8082
  datasource:
    base-url: http://localhost:8084
  env:
    base-url: http://localhost:8085
  file:
    base-url: http://localhost:8081
  automation:
    base-url: http://localhost:8086

management:
  endpoints:
    web:
      exposure:
        include: health
