server:
  port: 8083

spring:
  application:
    name: agent-service
  jackson:
    # 全局统一时区:Date/Instant 序列化偏移(JVM 默认时区由 nora-common TimeZoneConfig 设置)
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:postgresql://localhost:5432/nora?currentSchema=schema_agent
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_agent
    default-schema: schema_agent
    create-schemas: true
  cloud:
    nacos:
      discovery:
        enabled: true

nora:
  # 全局统一时区(nora-common TimeZoneConfig 消费;JVM 默认时区)
  timezone: Asia/Shanghai
  agent:
    # ReAct depth guard: max tool rounds per chat turn (harness convention 10-25)
    max-tool-rounds: 10
    # 本机终端(run_command)的 PowerShell:
    #   默认优先用随仓库分发的内置 pwsh 7(tools/pwsh,首次使用解压到同目录 pwsh-<ver>),
    #   保证版本确定、不依赖宿主机;解压失败/归档缺失时回退 PATH 上的 pwsh,再兜底系统 powershell.exe(5.1)。
    # powershell: 显式指定 pwsh 可执行文件(绝对路径或命令名);空=自动(内置→PATH)
    powershell: ${NORA_POWERSHELL:}
    # pwsh-bundle: 内置 pwsh 归档(zip)路径;空=禁用内置(直接用 PATH)
    pwsh-bundle: ${NORA_PWSH_BUNDLE:D:/claude/Nora/tools/pwsh/PowerShell-7.6.6-win-x64.zip}
  proxy:
    # 出站代理:外网目标(LLM 上游/Jina embedding)经此转发,内网服务互调始终直连。
    # 环境变量覆盖:NORA_PROXY_ENABLED / NORA_PROXY_HOST / NORA_PROXY_PORT
    enabled: ${NORA_PROXY_ENABLED:false}
    host: ${NORA_PROXY_HOST:127.0.0.1}
    port: ${NORA_PROXY_PORT:7897}
  llm:
    api-key: ${NORA_LLM_API_KEY:}
    base-url: ${NORA_LLM_BASE_URL:http://192.168.0.109:28765/v1}
    model: ${NORA_LLM_MODEL:gpt-5.4-mini}
  rag:
    base-url: http://localhost:8082
  datasource:
    base-url: http://localhost:8084
  env:
    base-url: http://localhost:8085
  file:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
