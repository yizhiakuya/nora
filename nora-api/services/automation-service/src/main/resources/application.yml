server:
  port: ${NORA_PORT:18086}

spring:
  jackson:
    time-zone: Asia/Shanghai
  application:
    name: automation-service
  datasource:
    url: ${NORA_DB_URL:jdbc:postgresql://localhost:15432/nora?currentSchema=schema_automation}
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_automation
    default-schema: schema_automation
    create-schemas: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NORA_NACOS_SERVER:localhost:18848}

nora:
  notification:
    # Kafka 事件总线(2026-09-19):通知事件发布——notification-service 消费落库,
    # 前端通知中心展示。Kafka 不可达时发布静默降级,不影响本服务主业务。
    enabled: true
    bootstrap-servers: localhost:9092
    source: automation-service
  timezone: Asia/Shanghai
  datasource:
    base-url: ${NORA_DATASOURCE_URL:http://localhost:18084}
  agent:
    base-url: ${NORA_AGENT_URL:http://localhost:18083}

management:
  endpoints:
    web:
      exposure:
        include: health
