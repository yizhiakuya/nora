server:
  port: ${NORA_PORT:18084}

spring:
  jackson:
    time-zone: Asia/Shanghai
  application:
    name: datasource-service
  datasource:
    url: ${NORA_DB_URL:jdbc:postgresql://localhost:15432/nora?currentSchema=schema_datasource}
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_datasource
    default-schema: schema_datasource
    create-schemas: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NORA_NACOS_SERVER:localhost:18848}

management:
  endpoints:
    web:
      exposure:
        include: health

# 全局统一时区(nora-common TimeZoneConfig 消费;JVM 默认时区)
nora:
  timezone: Asia/Shanghai
