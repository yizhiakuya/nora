server:
  port: 8085

spring:
  jackson:
    time-zone: Asia/Shanghai
  application:
    name: env-service
  datasource:
    url: jdbc:postgresql://localhost:5432/nora?currentSchema=schema_env
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_env
    default-schema: schema_env
    create-schemas: true
  cloud:
    nacos:
      discovery:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# 全局统一时区(nora-common TimeZoneConfig 消费;JVM 默认时区)
nora:
  notification:
    # Kafka 事件总线(2026-09-19):通知事件发布——notification-service 消费落库,
    # 前端通知中心展示。Kafka 不可达时发布静默降级,不影响本服务主业务。
    enabled: true
    bootstrap-servers: localhost:9092
    source: env-service
  timezone: Asia/Shanghai
