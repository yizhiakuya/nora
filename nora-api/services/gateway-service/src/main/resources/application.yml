server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        enabled: true
    gateway:
      routes:
        - id: agent
          uri: lb://agent-service
          predicates:
            - Path=/api/chat/**

management:
  endpoints:
    web:
      exposure:
        include: health
