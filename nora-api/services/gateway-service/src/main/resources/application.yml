server:
  port: 8080

spring:
  jackson:
    time-zone: Asia/Shanghai
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        enabled: true
    gateway:
      routes:
        - id: agent
          uri: lb://agent-service
          predicates:
            - Path=/api/chat/**
        - id: models
          uri: lb://agent-service
          predicates:
            - Path=/api/models/**
        - id: network
          uri: lb://agent-service
          predicates:
            - Path=/api/network/**
        - id: mcp
          uri: lb://agent-service
          predicates:
            - Path=/api/mcp/**
        - id: skills
          uri: lb://agent-service
          predicates:
            - Path=/api/skills/**
        - id: workspace
          uri: lb://agent-service
          predicates:
            - Path=/api/workspace/**
        - id: file
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
        - id: rag
          uri: lb://rag-service
          predicates:
            - Path=/api/rag/**
        - id: datasources
          uri: lb://datasource-service
          predicates:
            - Path=/api/datasources/**
        - id: automations
          uri: lb://automation-service
          predicates:
            - Path=/api/automations/**
        - id: environment
          uri: lb://env-service
          predicates:
            - Path=/api/environment/**

management:
  endpoints:
    web:
      exposure:
        include: health

# 全局统一时区(nora-common TimeZoneConfig 消费;JVM 默认时区)
nora:
  timezone: Asia/Shanghai
