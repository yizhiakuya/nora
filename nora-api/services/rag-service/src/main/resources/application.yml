server:
  port: 8082

spring:
  jackson:
    time-zone: Asia/Shanghai
  application:
    name: rag-service
  datasource:
    url: jdbc:postgresql://localhost:5432/nora
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_rag
    default-schema: schema_rag
    create-schemas: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        enabled: true

nora:
  notification:
    # Kafka 事件总线(2026-09-19):通知事件发布——notification-service 消费落库,
    # 前端通知中心展示。Kafka 不可达时发布静默降级,不影响本服务主业务。
    enabled: true
    bootstrap-servers: localhost:9092
    source: rag-service
  timezone: Asia/Shanghai
  # Redis(平台组件):嵌入结果内容寻址缓存,重复文本不再重复调 provider。
  # 禁用或不可达时直连 provider,不影响功能。
  redis:
    enabled: ${NORA_REDIS_ENABLED:true}
    host: ${NORA_REDIS_HOST:localhost}
    port: ${NORA_REDIS_PORT:6379}
    password: ${NORA_REDIS_PASSWORD:}
    database: ${NORA_REDIS_DATABASE:0}
    timeout-ms: ${NORA_REDIS_TIMEOUT_MS:2000}
  embedding:
    api-key: ${NORA_EMBEDDING_API_KEY:}
    base-url: https://api.jina.ai/v1
    model: jina-embeddings-v3
    dimensions: 1024
  proxy:
    # 外网 embedding 提供方走代理;内网服务互调直连。env: NORA_PROXY_ENABLED/HOST/PORT
    enabled: ${NORA_PROXY_ENABLED:false}
    host: ${NORA_PROXY_HOST:127.0.0.1}
    port: ${NORA_PROXY_PORT:7897}
  # 混合检索调参(向量 + pg_trgm 关键词,RRF 融合)
  retrieval:
    # 余弦相似度下限:低于此值不注入 prompt,避免「问你好也召回一堆垃圾」。
    # 0.51 取自 2026-09-22 评测复校(45 问题集):无关查询最高 0.476
    # (「明天开会几点」的语义漂移),相关查询最低 0.540(口语改写类)——
    # 取两带中点;旧值 0.45 会让无关问题以 0.46~0.48 越阈。
    min-score: ${NORA_RETRIEVAL_MIN_SCORE:0.51}
    vector-weight: ${NORA_RETRIEVAL_VECTOR_WEIGHT:2}
    keyword-weight: ${NORA_RETRIEVAL_KEYWORD_WEIGHT:1}
    candidate-pool: ${NORA_RETRIEVAL_CANDIDATE_POOL:20}
    min-keyword-query-length: ${NORA_RETRIEVAL_MIN_KEYWORD_QUERY_LENGTH:4}
    # 可选重排(阶段 B,方案 §6.2):默认关闭;开启需同时配置模型名。
    # 用 Jina /v1/rerank(与嵌入同一 provider/key);失败保留融合排序并标记降级。
    rerank-enabled: ${NORA_RETRIEVAL_RERANK_ENABLED:false}
    rerank-model: ${NORA_RETRIEVAL_RERANK_MODEL:jina-reranker-v2-base-multilingual}
  file-service:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
