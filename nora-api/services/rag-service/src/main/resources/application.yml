server:
  port: 8082

spring:
  jackson:
    time-zone: Asia/Shanghai
  application:
    name: rag-service
  datasource:
    url: jdbc:postgresql://localhost:5432/nora
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_rag
    default-schema: schema_rag
    create-schemas: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        enabled: true

nora:
  timezone: Asia/Shanghai
  # Redis(平台组件):嵌入结果内容寻址缓存,重复文本不再重复调 provider。
  # 禁用或不可达时直连 provider,不影响功能。
  redis:
    enabled: ${NORA_REDIS_ENABLED:true}
    host: ${NORA_REDIS_HOST:localhost}
    port: ${NORA_REDIS_PORT:6379}
    password: ${NORA_REDIS_PASSWORD:}
    database: ${NORA_REDIS_DATABASE:0}
    timeout-ms: ${NORA_REDIS_TIMEOUT_MS:2000}
  embedding:
    api-key: ${NORA_EMBEDDING_API_KEY:}
    base-url: https://api.jina.ai/v1
    model: jina-embeddings-v3
    dimensions: 1024
  proxy:
    # 外网 embedding 提供方走代理;内网服务互调直连。env: NORA_PROXY_ENABLED/HOST/PORT
    enabled: ${NORA_PROXY_ENABLED:false}
    host: ${NORA_PROXY_HOST:127.0.0.1}
    port: ${NORA_PROXY_PORT:7897}
  # 混合检索调参(向量 + pg_trgm 关键词,RRF 融合)
  retrieval:
    # 余弦相似度下限:低于此值不注入 prompt,避免「问你好也召回一堆垃圾」。
    # 0.45 取自实测:相关片段 0.46~0.76,无关查询 0.31~0.42,该值落在两带之间。
    min-score: ${NORA_RETRIEVAL_MIN_SCORE:0.45}
    vector-weight: ${NORA_RETRIEVAL_VECTOR_WEIGHT:2}
    keyword-weight: ${NORA_RETRIEVAL_KEYWORD_WEIGHT:1}
    candidate-pool: ${NORA_RETRIEVAL_CANDIDATE_POOL:20}
    min-keyword-query-length: ${NORA_RETRIEVAL_MIN_KEYWORD_QUERY_LENGTH:4}
  file-service:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
