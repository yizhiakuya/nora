server:
  port: 8082

spring:
  application:
    name: rag-service
  datasource:
    url: jdbc:postgresql://localhost:5432/nora
    username: nora
    password: nora
  flyway:
    enabled: true
    schemas: schema_rag
    default-schema: schema_rag
    create-schemas: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        enabled: true

nora:
  embedding:
    api-key: ${NORA_EMBEDDING_API_KEY:}
    base-url: https://api.jina.ai/v1
    model: jina-embeddings-v3
    dimensions: 1024
  proxy:
    # 外网 embedding 提供方走代理;内网服务互调直连。env: NORA_PROXY_ENABLED/HOST/PORT
    enabled: ${NORA_PROXY_ENABLED:false}
    host: ${NORA_PROXY_HOST:127.0.0.1}
    port: ${NORA_PROXY_PORT:7897}
  file-service:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
