# Nora 前端 nginx 配置:静态文件 + /api 反代到网关
# 说明:SSE(对话流)必须关闭缓冲;大文件上传放宽 body 限制。
#
# 关键(2026-10-01 实测):proxy_pass 写容器名会在 nginx 启动时解析一次并缓存——
# gateway 容器重建后 IP 变化导致 502。用 Docker 内置 DNS(127.0.0.11)+ 变量化
# proxy_pass 强制按 TTL 重解析。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS:短 TTL 重解析上游容器名(容器重建换 IP 不 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端路由(SPA):非文件路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到网关(gateway-service 容器;变量化强制重解析)
    location /api/ {
        set $gateway_upstream http://gateway-service:18080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE(对话流/日志流):关闭缓冲与超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # 文件上传
        client_max_body_size 512m;
    }

    # 静态资源缓存(构建产物带 hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
