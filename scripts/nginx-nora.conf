# Nora Docker HTTPS 入口（megumin；API 沿用网关令牌认证）
# 部署位置：megumin /etc/nginx/sites-available/nora
server {
    listen 13001 ssl;
    server_name nora.rainaki.top;

    ssl_certificate /etc/nginx/certs/rainaki.pem;
    ssl_certificate_key /etc/nginx/certs/rainaki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NORASSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 512m;
    error_page 497 =308 https://nora.rainaki.top:13001$request_uri;

    # nora-web 容器负责静态文件、SPA 路由及 /api 反代。
    location / {
        proxy_pass http://127.0.0.1:13002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }
}
