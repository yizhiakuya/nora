# Nora 工作台 生产入口（HTTPS；内网免认证，公网 Basic 认证）
# 部署位置：megumin /etc/nginx/sites-available/nora
server {
    listen 8900 ssl;
    server_name nora.rainaki.top;

    ssl_certificate /etc/nginx/certs/rainaki.pem;
    ssl_certificate_key /etc/nginx/certs/rainaki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NORASSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 200m;

    root /var/www/nora;
    index index.html;

    # 内网/本机免认证；公网必须 Basic 认证
    satisfy any;
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;
    auth_basic "Nora";
    auth_basic_user_file /etc/nginx/nora.htpasswd;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri /index.html;
    }
}
